[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-executive-briefing-engine"
version = "1.0.0"
description = "Enterprise AI Executive Briefing Engine - Automated multi-agent presentation generation with mathematical KPI validation, audit-grade verification, and Gamma MCP & API integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Philippe Godfroy", email = "philippe@godfroy.be" }
]
keywords = [
    "executive-briefing",
    "gamma-app",
    "gamma-mcp",
    "gamma-api",
    "business-analysis",
    "ai-agents",
    "presentation-automation",
    "solution-architecture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
briefing = "briefing_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
