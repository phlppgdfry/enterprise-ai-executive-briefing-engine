<svg width="480" height="160" viewBox="0 0 480 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050927" />
      <stop offset="50%" stop-color="#0f174a" />
      <stop offset="100%" stop-color="#1e1045" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7FA6F2" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="text-gold" x1="0" y1="0" x2="200" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="4" y="4" width="472" height="152" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Badge Icon Shield -->
  <g transform="translate(32, 34)">
    <circle cx="46" cy="46" r="42" fill="#152060" stroke="#7FA6F2" stroke-width="2" />
    <circle cx="46" cy="46" r="34" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 2" />
    <!-- Gamma Abstract Wave / Diamond -->
    <path d="M46 22 L66 46 L46 70 L26 46 Z" fill="none" stroke="#7FA6F2" stroke-width="2.5" />
    <path d="M46 30 L58 46 L46 62 L34 46 Z" fill="#fbbf24" opacity="0.9" />
    <circle cx="46" cy="46" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(142, 32)">
    <!-- Pill header -->
    <rect x="0" y="0" width="168" height="20" rx="10" fill="rgba(127, 166, 242, 0.15)" stroke="#7FA6F2" stroke-width="1" />
    <text x="84" y="14" fill="#7FA6F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="middle">GAMMA ACADEMY VERIFIED</text>

    <!-- Main Title -->
    <text x="0" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">GAMMA 101 MASTER ARCHITECT</text>

    <!-- Subtitle -->
    <text x="0" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Executive AI Presentation &amp; MCP Engineering</text>

    <!-- Metadata Row -->
    <g transform="translate(0, 88)">
      <text x="0" y="12" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ISSUED TO:</text>
      <text x="65" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHILIPPE GODFROY</text>

      <text x="190" y="12" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ID:</text>
      <text x="212" y="12" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">GAMMA-101-PHLPP-2026</text>
    </g>
  </g>
</svg>
